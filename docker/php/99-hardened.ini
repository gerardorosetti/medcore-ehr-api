; ==============================================================================
; MedCore EHR API - Hardened & High-Performance PHP 8.5 Configuration
; ==============================================================================

; --- General Security & Information Disclosure ---
; Prevent leaking the PHP version in HTTP response headers (e.g. X-Powered-By: PHP/8.5.x)
expose_php = Off

; Prevent passing command line arguments via query strings to superglobals ($_SERVER['argv'] / $_SERVER['argc']).
; Mitigation for CVE-2024-52301: Prevents attackers from manipulating Laravel's CLI/environment detection
; and query-string parameter pollution when invoked under certain FastCGI/CGI environments.
register_argc_argv = Off

; Prevent FastCGI from attempting to find alternative scripts if the requested script does not exist.
; Mitigation for CVE-2024-4577: Protects against argument injection and path traversal / arbitrary code execution
; via CGI parameter parsing flaws.
cgi.fix_pathinfo = 0

; Disallow remote file inclusion via require/include statements.
allow_url_include = Off

; Allow standard HTTP/HTTPS retrieval for external APIs, while remote code inclusion remains strictly blocked.
allow_url_fopen = On

; --- Upload & Memory Constraints (Mitigation for CVE-2026-109618 / CVE-2026-109619) ---
; Hardened limits against multipart parsing resource exhaustion and OOM vectors.
upload_max_filesize = 10M
max_file_uploads = 5
post_max_size = 12M
memory_limit = 256M
max_execution_time = 30
max_input_vars = 1000

; --- Session Hardening ---
; Prevent uninitialized session IDs from being accepted, guarding against session fixation.
session.use_strict_mode = 1

; Prevent JavaScript from accessing session cookies, defending against XSS attacks.
session.cookie_httponly = 1

; Mitigate CSRF risks by enforcing SameSite policy on session cookies.
session.cookie_samesite = "Lax"

; Ensure session IDs are only stored in cookies and never passed via URL parameters.
session.use_only_cookies = 1

; --- Realpath Cache & OPcache High-Performance Configuration (Windows Docker Bind-Mount Optimized) ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.enable_file_override = 1

; --- Function Restrictions & Execution Security Note ---
; NOTE: Functions such as proc_open, popen, pcntl_fork, and pcntl_* are intentionally kept ENABLED
; in this container image to ensure compatibility with Composer, Laravel Artisan queue workers,
; and the Pest test runner.
; For production deployments where CLI tooling is separated from the web worker, consider enforcing:
; disable_functions = exec,passthru,shell_exec,system,proc_open,popen,show_source
