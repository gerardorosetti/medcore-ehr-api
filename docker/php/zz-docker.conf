[global]
daemonize = no

[www]
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Automatically recycle worker processes after handling 500 requests to mitigate memory leaks
; and stale internal buffer states (mitigating CVE-2026-109618 / CVE-2026-109619)
pm.max_requests = 500

; Restrict FastCGI execution exclusively to .php files to prevent arbitrary script execution
security.limit_extensions = .php

; Preserve environment variables passed into the container so Laravel can read .env and system config
clear_env = no
