server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;

    # Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Protect against multipart / upload payload exhaustion attacks
    client_max_body_size 12M;

    charset utf-8;

    # Deny access to hidden dotfiles (e.g. .git, .env) with exception for ACME challenges
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block PHP execution in uploaded storage files to prevent remote code execution
    location ^~ /storage/ {
        location ~ \.php$ {
            deny all;
            return 404;
        }
        try_files $uri =404;
    }

    # Standard Laravel front-controller routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # FastCGI PHP-FPM processing
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}
