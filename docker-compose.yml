services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medcore_ehr_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - healthcare_net

  webserver:
    image: nginx:1.27-alpine
    container_name: medcore_ehr_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - healthcare_net

  db:
    image: postgres:16-alpine
    container_name: medcore_ehr_db
    ports:
      - "54320:5432"
    environment:
      POSTGRES_DB: medcore_ehr
      POSTGRES_USER: medcore
      POSTGRES_PASSWORD: secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcore -d medcore_ehr"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare_net

  redis:
    image: redis:7-alpine
    container_name: medcore_ehr_redis
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medcore_ehr_queue
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - healthcare_net

networks:
  healthcare_net:
    driver: bridge

volumes:
  pgdata:
